[project]
name = "dock"
version = "0.1.0"
description = "Shipping-document triage agent: classify inbound email, align SI/BL fields by meaning, flag discrepancies, escalate to human review."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dock = "dock.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ holds the organisers' bundle verbatim; it is read, never edited.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["dock", "tests"]
strict = true
warn_unused_ignores = false
